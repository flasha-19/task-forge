# Publishes the static frontend only. It never deploys contracts and never touches private keys.
name: deploy-frontend
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public, non-secret values: set under Settings > Secrets and variables > Actions > Variables
          VITE_TASKFORGE_ADDRESS: ${{ vars.VITE_TASKFORGE_ADDRESS }}
          VITE_USDC_ADDRESS: ${{ vars.VITE_USDC_ADDRESS }}
          VITE_DEPLOY_BLOCK: ${{ vars.VITE_DEPLOY_BLOCK }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
